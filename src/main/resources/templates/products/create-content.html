<div xmlns:th="http://www.thymeleaf.org">

  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Create Product</h1>
  </div>

  <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input type="text" th:field="*{name}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Brand</label>
        <input type="text" th:field="*{brand}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Model</label>
        <input type="text" th:field="*{model}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Category</label>
        <select th:field="*{category}" class="form-select">
          <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Price</label>
        <input type="number" step="0.01" th:field="*{price}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Stock</label>
        <input type="number" th:field="*{stock}" class="form-control">
      </div>

      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
      </div>

      <div class="col-md-6">
        <label class="form-label">Release Year</label>
        <input type="number" th:field="*{releaseYear}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Image</label>
        <input type="file" name="imageFile" class="form-control">
      </div>

    </div>

    <hr class="my-4">

    <button class="btn btn-primary" type="submit">Save</button>
    <a href="/products" class="btn btn-secondary">Cancel</a>

  </form>

</div>
